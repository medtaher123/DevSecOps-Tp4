name: supply-chain

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action scans push ranges with base^; that fails on the
      # first commit of a repo (no parent). Full-history detect is fine here.
      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks (historique complet)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  iac:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  build-sbom-sign:
    needs: iac
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t notes-api:1.0.0 .
      - name: SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: notes-api:1.0.0
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Login to GHCR
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and sign image
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):1.0.0"
          docker tag notes-api:1.0.0 "$IMAGE"
          docker push "$IMAGE"
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --key cosign.key --yes --tlog-upload=false "$IMAGE"
          rm -f cosign.key
      - name: Skip sign (secrets missing)
        if: ${{ env.COSIGN_PRIVATE_KEY == '' }}
        run: |
          echo "::warning::COSIGN_PRIVATE_KEY is not set. Add repo secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD, then re-run."
          echo "SBOM artifact was still uploaded."
